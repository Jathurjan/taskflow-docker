
services:
  mongo:
    image: mongo:8
    container_name: taskflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - taskflow-mongo-data:/data/db
    networks:
      - taskflow-network

  backend:
    build: ./backend
    container_name: taskflow-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - taskflow-network

  frontend:
    build: ./frontend
    container_name: taskflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskflow-network

volumes:
  taskflow-mongo-data:
    name: taskflow-mongo-data

networks:
  taskflow-network:
    name: taskflow-network
    driver: bridge
